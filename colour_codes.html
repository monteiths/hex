<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Codes | Hex Lab</title>
<style>
:root{--ink:#271d3d;--purple:#633da0;--light:#f7f3ff;--line:#ddd2ed}*{box-sizing:border-box}body{margin:0;background:#f8f6fc;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(125deg,#3f246d,#7e51bb);color:white;padding:25px max(20px,calc((100vw - 1080px)/2))}header h1{margin:0;font-size:clamp(1.8rem,4vw,2.6rem)}header p{margin:7px 0;color:#e9defb}main{max-width:1100px;margin:auto;padding:24px 18px 70px}a{color:#633da0;font-weight:700}header a{color:white}button{font:inherit;cursor:pointer;border:2px solid var(--purple);border-radius:11px;padding:11px 16px;background:white;color:var(--purple);font-weight:750}button:hover{background:#f1eaff}button:focus-visible{outline:3px solid #e2a100;outline-offset:2px}.active,.primary{background:var(--purple);color:white}.levels{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 24px}.levels button{flex:1;min-width:135px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);box-shadow:0 6px 24px #3923510b}h2{margin:0 0 10px}p{line-height:1.55}.muted{color:#685b7c}.swatches{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(5px,1.2vw,12px);margin:22px auto;max-width:960px}.swatch{width:100%;aspect-ratio:2.8;min-width:0;border:3px solid #ddd;border-radius:10px;padding:0;box-shadow:0 3px 6px #271d3d19;transition:transform .15s,border-color .15s}.swatch:hover{transform:scale(1.04)}.swatch.chosen{border:5px solid #18101e;outline:3px solid #ffc944;outline-offset:2px}.preview{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin:20px 0;background:var(--light);padding:20px;border-radius:15px}.big{width:clamp(155px,28vw,280px);height:clamp(155px,28vw,280px);border-radius:18px;border:5px solid white;box-shadow:0 5px 20px #281b3d35;flex-shrink:0}.prompt{flex:1;min-width:220px}.prompt strong{font-size:1.25rem}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.hidden{display:none!important}.codebox{background:#21182f;color:white;padding:18px;border-radius:14px;margin:16px 0;overflow-wrap:anywhere}.codebox h3{margin:0 0 12px;color:#f8df93}.channels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.channel{border:1px solid #c7b4e0;border-radius:12px;padding:14px;background:#fff;color:#21182f;text-align:center;min-width:0}.channel strong{display:block;font-size:1.4rem;margin:8px 0}.bits{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:clamp(.8rem,1.9vw,1.25rem);font-weight:800;letter-spacing:.06em;overflow-wrap:anywhere}.red{border-top:7px solid #ed4652}.green{border-top:7px solid #25a86b}.blue{border-top:7px solid #4287e9}.nibbles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0}.nibble{border:2px solid #cbb9e1;background:white;color:#271d3d;border-radius:10px;padding:12px;text-align:center;min-width:92px}.nibble b{display:block;font:800 1.1rem ui-monospace,monospace}.nibble span{display:block;margin-top:7px;font-size:1.5rem;font-weight:900;color:#633da0}.sum{font-size:1.35rem;font-weight:800;text-align:center}.note{border-left:5px solid var(--purple);background:var(--light);padding:14px 18px;border-radius:9px;margin-top:20px}.navbuttons{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}@media(max-width:650px){.channels{grid-template-columns:1fr}.swatch{border-width:2px}.levels button{min-width:115px}.big{width:160px;height:160px}}
</style></head><body>
<header><a href="index.html">← Back to Hex Lab</a><h1>COLOUR CODE LAB 🎨</h1><p>From describing colours in words to communicating them with binary and hexadecimal.</p></header>
<main><div class="levels" id="levels" aria-label="Choose lesson level"></div>
<section class="panel"><h2 id="heading"></h2><p id="intro"></p><div id="swatches" class="swatches" aria-label="Colour choices"></div>
<div class="preview"><div id="big" class="big" aria-label="Selected colour"></div><div class="prompt"><strong id="question"></strong><p id="guidance"></p><div class="actions"><button id="new" type="button">Choose another colour</button><button id="next" type="button" class="primary">Next level →</button></div></div></div>
<div id="code" class="hidden" aria-live="polite"></div>
<div class="note" id="teaching"></div></section>
<footer><p>RGB uses three channels: red, green and blue. Each channel stores an 8-bit number from 0 to 255. Together they make 24 bits (three bytes).</p></footer>
</main>
<script>
"use strict";
const names=["3 colours","9 colours","16 colours","128 colours","Binary RGB","Hexadecimal","Colour maker"];
const headings=["Level 1 · Three colours","Level 2 · Nine colours","Level 3 · Sixteen colours","Level 4 · 128 colours","Level 5 · Describe a colour in binary","Level 6 · Translate binary into hexadecimal","Level 7 · Make your own colour"];
const intros=[
"Start with just three colours. Click one to enlarge it. Ask the class to describe it in words.",
"Now there are nine colours. Select one: can everyone agree on its name?",
"Sixteen colours. Which are blue, teal, turquoise, purple or violet? Are descriptions still precise?",
"Now there are 128 colours. Try telling someone exactly which colour you selected without pointing at it.",
"Computers do not store names such as ‘bright blue’. They store a number for red, a number for green, and a number for blue. Each number uses 8 binary digits.",
"Twenty-four binary digits are accurate, but cumbersome to read aloud. Group the bits into fours and convert each group into one hexadecimal digit.","Now make your own colour by entering binary or hexadecimal RGB values."
];
const hints=[
"Ask: ‘What colour is this?’ Then: ‘Would everyone call it the same thing?’",
"Ask: ‘Could someone reproduce this exact colour just from your words?’",
"Ask: ‘Would “light green” identify one precise square?’",
"Ask: ‘Could we invent 128 unambiguous names? What if there were millions?’",
"Ask: ‘How many bits are used for each channel? How many for the whole colour?’",
"Ask: ‘Is #RRGGBB easier to copy and communicate than 24 individual bits?’","Challenge: make white with 11111111 in every binary channel, or FF in every hex channel."
];
const basic=[[255,0,0],[0,255,0],[0,0,255]];
const nine=[[255,0,0],[0,255,0],[0,0,255],[255,255,0],[255,0,255],[0,255,255],[255,128,0],[128,0,255],[128,128,128]];
const sixteen=[[255,0,0],[0,255,0],[0,0,255],[255,255,0],[255,0,255],[0,255,255],[255,128,0],[128,0,255],[128,128,128],[0,128,128],[128,0,0],[0,128,0],[0,0,128],[255,192,203],[180,255,120],[255,255,255]];
// 128 distinct RGB colours sampled from a 4 × 4 × 8 channel grid.
const many=[];for(const r of [0,85,170,255])for(const g of [0,85,170,255])for(const b of [0,36,73,109,146,182,219,255])many.push([r,g,b]);
const palettes=[basic,nine,sixteen,many,many,many,[]];
let level=0,selection=0,makerMode="binary";
const el=id=>document.getElementById(id);
const rgb=c=>"rgb("+c.join(",")+")";
const binary=n=>n.toString(2).padStart(8,"0");
const hex=n=>n.toString(16).toUpperCase().padStart(2,"0");
function select(i){selection=i;const c=palettes[level][i];el("big").style.background=rgb(c);document.querySelectorAll(".swatch").forEach((b,j)=>{b.classList.toggle("chosen",j===i);b.setAttribute("aria-pressed",j===i?"true":"false")});if(level>=4&&level<6)showCode(c)}
function showCode(c){
const b=c.map(binary),h=c.map(hex);
let out='<div class="codebox"><h3>RGB: three 8-bit binary numbers</h3><div class="channels">';
["Red","Green","Blue"].forEach((name,i)=>{out+='<div class="channel '+name.toLowerCase()+'"><b>'+name+'</b><strong>'+c[i]+' / 255</strong><div class="bits">'+b[i].slice(0,4)+' '+b[i].slice(4)+'</div><small>8 bits</small></div>'});
out+='</div><p class="sum" style="color:white">8 + 8 + 8 = 24 bits</p></div>';
if(level===4){out+='<p><strong>Read the channels separately:</strong> red '+c[0]+', green '+c[1]+', blue '+c[2]+'. Each decimal value is stored as its own 8-bit sequence.</p>'}
if(level===5){out+='<p class="muted">At the next level we will shorten these 24 binary digits to six hexadecimal digits.</p>'}
if(level===4){el("code").innerHTML=out;return}
out+='<h3>Convert each group of four bits into one hex digit</h3><div class="nibbles">';
for(let i=0;i<3;i++)for(let j=0;j<2;j++){const bits=b[i].slice(j*4,j*4+4);out+='<div class="nibble"><b>'+bits+'</b><span>↓ '+parseInt(bits,2).toString(16).toUpperCase()+'</span></div>'}
out+='</div><p class="sum">#'+h.join("")+'</p><p>For example, each 8-bit channel becomes <strong>two hex digits</strong>. Three channels × two digits = <strong>six hexadecimal digits</strong>, written as <strong>#RRGGBB</strong>.</p>';
out+='<p class="muted">The # is a colour-code marker, not a seventh hexadecimal digit. Leading zeros are important.</p>';
el("code").innerHTML=out;
}
function render(){
el("levels").innerHTML=names.map((n,i)=>'<button type="button" data-level="'+i+'" class="'+(i===level?"active":"")+'" aria-current="'+(i===level?"step":"false")+'">'+(i+1)+' · '+n+'</button>').join("");
document.querySelectorAll("[data-level]").forEach(b=>b.addEventListener("click",()=>setLevel(Number(b.dataset.level))));
el("heading").textContent=headings[level];el("intro").textContent=intros[level];el("teaching").textContent=hints[level];
el("question").textContent=level<4?"How would you describe this colour in words?":level===4?"What exact RGB binary sequence describes this colour?":level===5?"How can we make this 24-bit colour code easier to communicate?":"Can you make a colour with binary or hexadecimal?";
el("guidance").textContent=level<4?"Click a coloured square to make it larger. Discuss before moving on.":level<6?"Select any colour to see its exact RGB code and the worked conversion.":"Enter three 8-bit binary values or three two-digit hex values.";
el("next").textContent=level===6?"Return to level 1":"Next level →";
const p=palettes[level];el("swatches").classList.toggle("hidden",level===6);el("new").classList.toggle("hidden",level===6);el("swatches").style.setProperty("--cols",level===0?"3":level===1?"3":level===2?"8":"16");
el("swatches").innerHTML=p.map((c,i)=>'<button class="swatch" type="button" data-colour="'+i+'" style="background:'+rgb(c)+'" aria-label="Colour '+(i+1)+'" aria-pressed="false"></button>').join("");
document.querySelectorAll("[data-colour]").forEach(b=>b.addEventListener("click",()=>select(Number(b.dataset.colour))));
el("code").classList.toggle("hidden",level<4);
if(level===6){renderMaker();return;}selection=Math.min(selection,p.length-1);select(selection);
}

function renderMaker(){
 const code=el("code");
 code.innerHTML='<h3>Build an RGB colour</h3><div class="actions"><button type="button" id="modeBinary">Binary (8 bits each)</button><button type="button" id="modeHex">Hexadecimal (2 digits each)</button></div><p>Enter the red, green and blue channel values. Spaces are optional.</p><div class="channels" id="makerInputs"></div><div class="actions"><button type="button" class="primary" id="makeColour">Make colour</button><button type="button" id="whitePreset">Make white</button><button type="button" id="blackPreset">Make black</button><button type="button" id="randomPreset">Surprise me</button></div><p id="makerError" role="alert" style="color:#a12e31;font-weight:750"></p><div id="makerResult" class="note"></div>';
 el("modeBinary").classList.toggle("primary",makerMode==="binary");
 el("modeHex").classList.toggle("primary",makerMode==="hex");
 const defaults=makerMode==="binary"?["1111 1111","1111 1111","1111 1111"]:["FF","FF","FF"];
 el("makerInputs").innerHTML=["Red","Green","Blue"].map((n,i)=>'<label class="channel '+n.toLowerCase()+'"><strong>'+n+'</strong><input aria-label="'+n+' '+makerMode+'" id="maker'+i+'" style="width:100%;font:700 1.1rem ui-monospace,monospace;text-align:center;padding:10px;margin-top:12px;border:2px solid #c7b4e0;border-radius:8px" maxlength="12" value="'+defaults[i]+'"></label>').join("");
 el("modeBinary").onclick=()=>{makerMode="binary";renderMaker()};
 el("modeHex").onclick=()=>{makerMode="hex";renderMaker()};
 el("makeColour").onclick=makeColour;
 el("whitePreset").onclick=()=>setMakerValues([255,255,255]);
 el("blackPreset").onclick=()=>setMakerValues([0,0,0]);
 el("randomPreset").onclick=()=>setMakerValues(Array.from({length:3},()=>Math.floor(Math.random()*256)));
 makeColour();
}
function setMakerValues(values){values.forEach((v,i)=>el("maker"+i).value=makerMode==="binary"?binary(v).replace(/(.{4})/,"$1 "):hex(v));makeColour()}
function makeColour(){
 const values=[];
 for(let i=0;i<3;i++){
  const cleaned=el("maker"+i).value.replace(/\s/g,"");
  const valid=makerMode==="binary"?/^[01]{8}$/.test(cleaned):/^[0-9a-fA-F]{2}$/.test(cleaned);
  if(!valid){el("makerError").textContent=makerMode==="binary"?"Each channel needs exactly 8 binary digits (0 or 1).":"Each channel needs exactly 2 hexadecimal digits (0–9 or A–F).";el("makerResult").textContent="";return}
  values.push(parseInt(cleaned,makerMode==="binary"?2:16));
 }
 el("makerError").textContent="";
 el("big").style.background=rgb(values);
 el("makerResult").innerHTML='<strong>Your colour:</strong> RGB ('+values.join(", ")+')<p><strong>Binary:</strong> '+values.map(v=>binary(v).replace(/(.{4})/,"$1 ")).join(" &nbsp; ")+'</p><p><strong>Hex:</strong> #'+values.map(hex).join("")+' ('+values.map(hex).join(" ") +')</p>';
}
function setLevel(n){level=n;selection=0;render()}
el("new").addEventListener("click",()=>select((selection+1)%palettes[level].length));
el("next").addEventListener("click",()=>setLevel((level+1)%7));
render();
</script></body></html>
